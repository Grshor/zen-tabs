<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Разбор вкладок</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Разбор вкладок</h1>
      <p id="status">Готово к разбору.</p>
    </header>

    <div class="actions">
      <button id="byModel" class="primary">Разобрать по смыслу</button>
      <button id="byDomain">По доменам</button>
    </div>

    <section id="models">
      <h2>Локальные модели <span id="modelsState" class="hint"></span></h2>
      <p id="modelsHint" class="hint"></p>
      <div class="actions">
        <button id="modelsFull" class="primary">Поднять все три</button>
        <button id="modelsDecider">Только решатель</button>
        <button id="modelsStop">Остановить</button>
      </div>
    </section>

    <section id="duplicates" hidden>
      <h2>Дубликаты <span id="dupeCount"></span></h2>
      <ul id="dupeList"></ul>
      <button id="closeDupes" class="danger">Закрыть лишние</button>
    </section>

    <section id="plan" hidden>
      <h2>Предлагаемые группы</h2>
      <ul id="groupList"></ul>
      <div class="actions">
        <button id="apply" class="primary">Применить</button>
        <button id="clear">Сбросить</button>
      </div>
    </section>

    <section id="leftovers" hidden>
      <h2>Вне групп</h2>
      <ul id="leftoverList"></ul>
    </section>

    <section id="spaces" hidden>
      <h2>Пространства (план переносов)</h2>
      <p id="planStatus" class="hint"></p>
      <label class="pick">Текущее пространство: <select id="spacePick"></select></label>
      <p id="spaceCounts" class="hint"></p>
      <div class="actions">
        <button id="pullIn" class="primary">Открыть здесь</button>
        <button id="pushOut">Закрыть перенесённые</button>
      </div>
    </section>

    <footer>
      <label><input type="checkbox" id="skipPinned" checked /> не трогать закреплённые</label>
      <span id="meta"></span>
    </footer>

    <script src="core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
